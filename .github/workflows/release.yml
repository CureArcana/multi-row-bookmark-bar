name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create ZIP
        run: cd extension && zip -r ../multi-row-bookmark-bar-${{ github.ref_name }}.zip .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: multi-row-bookmark-bar-${{ github.ref_name }}.zip
          generate_release_notes: true
