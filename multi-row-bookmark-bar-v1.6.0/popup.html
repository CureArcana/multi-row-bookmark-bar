<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 300px;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      font-size: 13px;
      color: #202124;
      background: #fff;
      padding: 16px;
    }
    h1 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    h1 img { width: 20px; height: 20px; }
    .section {
      margin-bottom: 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid #e8eaed;
    }
    .section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 0;
      cursor: pointer;
    }
    label .label-text {
      font-size: 13px;
      color: #3c4043;
    }
    label .label-desc {
      font-size: 11px;
      color: #5f6368;
      margin-top: 2px;
    }
    .toggle {
      position: relative;
      width: 36px;
      height: 20px;
      flex-shrink: 0;
    }
    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .toggle .slider {
      position: absolute;
      inset: 0;
      background: #dadce0;
      border-radius: 10px;
      transition: background 0.2s;
      cursor: pointer;
    }
    .toggle .slider::before {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      left: 2px;
      top: 2px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle input:checked + .slider {
      background: #1a73e8;
    }
    .toggle input:checked + .slider::before {
      transform: translateX(16px);
    }
    select {
      padding: 4px 8px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      font-size: 12px;
      background: #fff;
      color: #202124;
      cursor: pointer;
    }
    select:focus {
      outline: none;
      border-color: #1a73e8;
    }
    input[type="number"] {
      width: 50px;
      padding: 4px 6px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      font-size: 12px;
      text-align: center;
    }
    input[type="number"]:focus {
      outline: none;
      border-color: #1a73e8;
    }
    .version {
      text-align: center;
      font-size: 11px;
      color: #9aa0a6;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <h1>
    <img src="icons/icon48.png" alt="">
    Multi-Row Bookmark Bar
  </h1>

  <div class="section">
    <label>
      <div>
        <div class="label-text">Enabled</div>
      </div>
      <div class="toggle">
        <input type="checkbox" id="enabled" checked>
        <span class="slider"></span>
      </div>
    </label>
  </div>

  <div class="section">
    <label>
      <div>
        <div class="label-text">Font size (px)</div>
        <div class="label-desc">8 - 20</div>
      </div>
      <input type="number" id="fontSize" value="12" min="8" max="20">
    </label>
  </div>

  <div class="section">
    <label>
      <div>
        <div class="label-text">Row height (px)</div>
        <div class="label-desc">20 - 60</div>
      </div>
      <input type="number" id="barHeight" value="36" min="20" max="60">
    </label>
  </div>

  <div class="section">
    <label>
      <div>
        <div class="label-text">Max rows</div>
        <div class="label-desc">0 = unlimited</div>
      </div>
      <input type="number" id="maxRows" value="0" min="0" max="10">
    </label>
  </div>

  <div class="section">
    <label>
      <div>
        <div class="label-text">Bar mode</div>
        <div class="label-desc">Overflow = continue from hidden bookmarks</div>
      </div>
      <select id="barMode">
        <option value="overflow">Overflow only</option>
        <option value="independent">All bookmarks</option>
      </select>
    </label>
  </div>

  <div class="section">
    <label>
      <div>
        <div class="label-text">Boundary offset</div>
        <div class="label-desc">Shift start position (- = earlier)</div>
      </div>
      <input type="number" id="boundaryOffset" value="0" min="-5" max="5">
    </label>
  </div>

  <div class="section">
    <label>
      <div>
        <div class="label-text">Display mode</div>
      </div>
      <select id="displayMode">
        <option value="both">Icon + Text</option>
        <option value="icon_only">Icon only</option>
        <option value="text_only">Text only</option>
      </select>
    </label>
  </div>

  <div class="section">
    <label>
      <div>
        <div class="label-text">Folder open</div>
      </div>
      <select id="folderOpenMode">
        <option value="hover">Hover</option>
        <option value="click">Click</option>
      </select>
    </label>
  </div>

  <div class="section">
    <label>
      <div>
        <div class="label-text">Show condition</div>
      </div>
      <select id="showCondition">
        <option value="always">Always</option>
        <option value="new_tab_only">New tab only</option>
      </select>
    </label>
  </div>

  <div class="version">v1.6.2</div>

  <script src="popup.js"></script>
</body>
</html>
