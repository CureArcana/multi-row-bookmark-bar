<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 300px;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      font-size: 13px;
      color: #202124;
      background: #fff;
      padding: 16px;
    }
    h1 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    h1 img { width: 20px; height: 20px; }
    .section {
      margin-bottom: 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid #e8eaed;
    }
    .section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 0;
      cursor: pointer;
    }
    label .label-text {
      font-size: 13px;
      color: #3c4043;
    }
    label .label-desc {
      font-size: 11px;
      color: #5f6368;
      margin-top: 2px;
    }
    .toggle {
      position: relative;
      width: 36px;
      height: 20px;
      flex-shrink: 0;
    }
    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .toggle .slider {
      position: absolute;
      inset: 0;
      background: #dadce0;
      border-radius: 10px;
      transition: background 0.2s;
      cursor: pointer;
    }
    .toggle .slider::before {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      left: 2px;
      top: 2px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle input:checked + .slider {
      background: #1a73e8;
    }
    .toggle input:checked + .slider::before {
      transform: translateX(16px);
    }
    select {
      padding: 4px 8px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      font-size: 12px;
      background: #fff;
      color: #202124;
      cursor: pointer;
    }
    select:focus {
      outline: none;
      border-color: #1a73e8;
    }
    input[type="number"] {
      width: 50px;
      padding: 4px 6px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      font-size: 12px;
      text-align: center;
    }
    input[type="number"]:focus {
      outline: none;
      border-color: #1a73e8;
    }
    .version {
      text-align: center;
      font-size: 11px;
      color: #9aa0a6;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <h1>
    <img src="icons/icon48.png" alt="">
    Multi-Row Bookmark Bar
  </h1>

  <div class="section">
    <label>
      <div>
        <div class="label-text" data-i18n="enabled">Enabled</div>
      </div>
      <div class="toggle">
        <input type="checkbox" id="enabled" checked>
        <span class="slider"></span>
      </div>
    </label>
  </div>

  <div class="section">
    <label>
      <div>
        <div class="label-text" data-i18n="fontSizeUnit">Font size (px)</div>
        <div class="label-desc" data-i18n="range820">8 - 20</div>
      </div>
      <input type="number" id="fontSize" value="12" min="8" max="20">
    </label>
  </div>

  <div class="section">
    <label>
      <div>
        <div class="label-text" data-i18n="rowHeightUnit">Row height (px)</div>
        <div class="label-desc" data-i18n="range2060">20 - 60</div>
      </div>
      <input type="number" id="barHeight" value="36" min="20" max="60">
    </label>
  </div>

  <div class="section">
    <label>
      <div>
        <div class="label-text" data-i18n="maxRowsShort">Max rows</div>
        <div class="label-desc" data-i18n="maxRowsDesc">0 = unlimited</div>
      </div>
      <input type="number" id="maxRows" value="0" min="0" max="10">
    </label>
  </div>

  <div class="section">
    <label>
      <div>
        <div class="label-text" data-i18n="language">Language</div>
      </div>
      <select id="language">
        <option value="auto" data-i18n="langAuto">Match browser</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
      </select>
    </label>
  </div>

  <div class="section">
    <label>
      <div>
        <div class="label-text" data-i18n="ntpMode">New tab page</div>
        <div class="label-desc" data-i18n="ntpModeDesc">Custom shows the multi-row bar on new tabs</div>
      </div>
      <select id="ntpMode">
        <option value="custom" data-i18n="ntpCustom">Custom with bar</option>
        <option value="default" data-i18n="ntpDefault">Chrome default</option>
      </select>
    </label>
  </div>

  <div class="section">
    <label>
      <div>
        <div class="label-text" data-i18n="displayBehavior">Display</div>
        <div class="label-desc" data-i18n="displayBehaviorDesc">Auto-hide never alters page layout</div>
      </div>
      <select id="displayBehavior">
        <option value="autohide" data-i18n="autohideOption">Auto-hide overlay</option>
        <option value="push" data-i18n="pushOption">Push page down</option>
      </select>
    </label>
  </div>

  <div class="section">
    <label>
      <div>
        <div class="label-text" data-i18n="revealEdge">Reveal area height (px)</div>
        <div class="label-desc" data-i18n="revealEdgeDesc">Show when cursor is within N px of the top (1 - 50)</div>
      </div>
      <input type="number" id="revealEdgePx" value="2" min="1" max="50" step="1">
    </label>
    <label>
      <div>
        <div class="label-text" data-i18n="revealDelay">Reveal delay (ms)</div>
        <div class="label-desc" data-i18n="revealDelayDesc">0 - 1000</div>
      </div>
      <input type="number" id="revealDelayMs" value="0" min="0" max="1000" step="50">
    </label>
    <label>
      <div>
        <div class="label-text" data-i18n="autohideDelay">Hide delay (ms)</div>
        <div class="label-desc" data-i18n="autohideDelayDesc">After leaving the bar area (100 - 5000)</div>
      </div>
      <input type="number" id="autohideDelayMs" value="400" min="100" max="5000" step="100">
    </label>
    <label>
      <div>
        <div class="label-text" data-i18n="hideOnClick">Hide after opening a bookmark</div>
      </div>
      <div class="toggle">
        <input type="checkbox" id="hideOnClick" checked>
        <span class="slider"></span>
      </div>
    </label>
    <label>
      <div>
        <div class="label-text" data-i18n="hideOnOutsideClick">Hide when clicking outside</div>
      </div>
      <div class="toggle">
        <input type="checkbox" id="hideOnOutsideClick" checked>
        <span class="slider"></span>
      </div>
    </label>
  </div>

  <div class="section">
    <label>
      <div>
        <div class="label-text" data-i18n="barMode">Bar mode</div>
        <div class="label-desc" data-i18n="barModeDesc">Overflow = continue from hidden bookmarks</div>
      </div>
      <select id="barMode">
        <option value="overflow" data-i18n="overflowOnly">Overflow only</option>
        <option value="independent" data-i18n="allBookmarks">All bookmarks</option>
      </select>
    </label>
  </div>

  <div class="section">
    <label>
      <div>
        <div class="label-text" data-i18n="boundaryAdjust">Boundary offset</div>
        <div class="label-desc" data-i18n="boundaryOffsetDesc">Shift start position (- = earlier)</div>
      </div>
      <input type="number" id="boundaryOffset" value="0" min="-600" max="600" step="10">
    </label>
  </div>

  <div class="section">
    <label>
      <div>
        <div class="label-text" data-i18n="displayMode">Display mode</div>
      </div>
      <select id="displayMode">
        <option value="both" data-i18n="iconText">Icon + Text</option>
        <option value="icon_only" data-i18n="iconOnly">Icon only</option>
        <option value="text_only" data-i18n="textOnly">Text only</option>
      </select>
    </label>
  </div>

  <div class="section">
    <label>
      <div>
        <div class="label-text" data-i18n="folderOpen">Folder open</div>
      </div>
      <select id="folderOpenMode">
        <option value="hover" data-i18n="hover">Hover</option>
        <option value="click" data-i18n="click">Click</option>
      </select>
    </label>
  </div>

  <div class="section">
    <label>
      <div>
        <div class="label-text" data-i18n="hoverCloseDelay">Folder close delay</div>
        <div class="label-desc" data-i18n="hoverCloseDelayDesc">ms until a hovered folder closes (100 - 2000)</div>
      </div>
      <input type="number" id="hoverCloseMs" value="400" min="100" max="2000" step="100">
    </label>
  </div>

  <div class="section">
    <label>
      <div>
        <div class="label-text" data-i18n="showCondition">Show condition</div>
      </div>
      <select id="showCondition">
        <option value="always" data-i18n="always">Always</option>
        <option value="new_tab_only" data-i18n="newTabOnly">New tab only</option>
      </select>
    </label>
  </div>

  <div class="version">v2.3.2</div>

  <script src="popup.js"></script>
</body>
</html>
